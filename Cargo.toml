[package]
name = "tomcat"
version = "0.1.0"
edition = "2024"
description = "PIR-triggered ultrasonic cat deterrent for Raspberry Pi"
license = "MIT"
repository = "https://github.com/cargopete/tomcat-rs"

[features]
default = ["sqlite"]
# The event log. tone-sweep has no use for it, and leaving it out avoids
# compiling a vendored SQLite, which on a Pi 4 is most of the build.
sqlite = ["dep:rusqlite"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
signal-hook = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.22"

[[bin]]
name = "tone-sweep"
path = "src/bin/tone_sweep.rs"

[[bin]]
name = "catdeter"
path = "src/bin/catdeter.rs"
required-features = ["sqlite"]

[profile.release]
lto = true
strip = true
opt-level = "s"
