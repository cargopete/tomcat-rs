[package]
name = "tomcat"
version = "0.1.0"
edition = "2024"
description = "PIR-triggered ultrasonic cat deterrent for Raspberry Pi"
license = "MIT"
repository = "https://github.com/cargopete/tomcat-rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
signal-hook = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.22"

[[bin]]
name = "tone-sweep"
path = "src/bin/tone_sweep.rs"

[[bin]]
name = "catdeter"
path = "src/bin/catdeter.rs"

[profile.release]
lto = true
strip = true
opt-level = "s"
